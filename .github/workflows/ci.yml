# CI del proyecto final: en cada push y pull request a main se comprueban las DOS piezas
# (el agente y el servidor MCP) y que los secretos de LangFuse llegan bien. Si todo sale verde,
# cd.yml despliega en Azure.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agente:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente/requirements-ci.txt
      # requirements-ci.txt: sin torch. Los tests usan un LLM falso y memoria en RAM (ver agente/tests/)
      - name: Instalar dependencias
        run: pip install -r requirements-ci.txt
      - name: Linting (ruff check)
        run: ruff check .
      - name: Formato (ruff format --check)
        run: ruff format --check .
      - name: Tests (pytest)
        run: pytest -v

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Linting (ruff check)
        run: ruff check .
      - name: Formato (ruff format --check)
        run: ruff format --check .
      - name: Tests (pytest)
        run: pytest -v

  # Los secretos NO estan en el codigo: llegan como variables de entorno desde GitHub Secrets
  secretos:
    needs: [agente, mcp]
    runs-on: ubuntu-latest
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r agente/requirements-ci.txt
      - name: Smoke test de LangFuse (con los Secrets)
        run: python agente/scripts/check_langfuse.py
